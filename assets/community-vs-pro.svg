<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
<title id="title">Community vs Pro</title><desc id="desc">Open Community features and closed Pro features.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1830"/></linearGradient></defs>
<rect width="1600" height="850" rx="32" fill="url(#bg)"/>
<text x="800" y="78" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" text-anchor="middle">Community vs <tspan fill="#38d8f6">Pro</tspan></text>
<text x="800" y="116" fill="#8fa5c0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" text-anchor="middle">What is open · what remains commercial · why the boundary matters</text>
<g transform="translate(65 165)"><rect width="610" height="510" rx="28" fill="#0c1d2f" stroke="#2dd4bf" stroke-width="2"/>
<text x="38" y="58" fill="#7df7db" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="2">PUBLIC · GPL-3.0</text>
<text x="38" y="108" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800">Tashev Guard Community</text>
<text x="38" y="146" fill="#9fb2c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Useful on its own. No cloud account required.</text>
<line x1="38" y1="176" x2="572" y2="176" stroke="#2dd4bf" stroke-opacity=".45"/>
<g fill="#d4e2f3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">
<text x="58" y="226">✓ Local agent &amp; web dashboard</text><text x="58" y="276">✓ Connections &amp; listening ports</text>
<text x="58" y="326">✓ Baseline &amp; local history</text><text x="58" y="376">✓ Android local audit</text>
<text x="58" y="426">✓ Local notifications</text><text x="58" y="476">✓ Public interoperability protocol</text></g></g>
<g transform="translate(925 165)"><rect width="610" height="510" rx="28" fill="#151936" stroke="#8b5cf6" stroke-width="2"/>
<text x="38" y="58" fill="#fde68a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="2">PRIVATE · COMMERCIAL</text>
<text x="38" y="108" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800">Tashev Guard Pro</text>
<text x="38" y="146" fill="#b8b1db" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Closed business functions and managed services.</text>
<line x1="38" y1="176" x2="572" y2="176" stroke="#8b5cf6" stroke-opacity=".5"/>
<g fill="#e1ddf3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">
<text x="58" y="226">◆ Secure device pairing</text><text x="58" y="276">◆ Multi-device dashboard</text>
<text x="58" y="326">◆ Long-term centralized history</text><text x="58" y="376">◆ Alerts &amp; integrations</text>
<text x="58" y="426">◆ Organizations · teams · roles</text><text x="58" y="476">◆ Policies · reports · billing</text></g></g>
<g transform="translate(705 180)"><rect width="190" height="470" rx="24" fill="#0e1c30" stroke="#38bdf8" stroke-opacity=".6"/>
<text x="95" y="52" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="middle">BOUNDARY</text>
<text x="95" y="110" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" text-anchor="middle">↔</text>
<g fill="#9bdcff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">
<text x="95" y="168">Versioned</text><text x="95" y="190">protocol</text>
<text x="95" y="246">Outbound secure</text><text x="95" y="268">connection</text>
<text x="95" y="324">Community works</text><text x="95" y="346">without Pro</text>
<text x="95" y="402">Pro stays separate</text><text x="95" y="424">from GPL code</text></g></g>
<text x="800" y="734" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" text-anchor="middle">Open core builds trust. Pro captures monetization. Clear boundaries preserve control.</text>
<text x="800" y="782" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle">CLA · trademark policy · public protocol · proprietary services</text>
</svg>