<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Tashev Guard dashboard preview</title>
<desc id="desc">Mockup of the local Tashev Guard security dashboard.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".5" stop-color="#0b1c33"/><stop offset="1" stop-color="#081522"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
</defs>
<rect width="1600" height="900" rx="32" fill="#050b14"/>
<rect x="40" y="40" width="1520" height="820" rx="24" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".08"/>
<rect x="40" y="40" width="1520" height="70" rx="24" fill="#0b1627"/>
<circle cx="78" cy="75" r="7" fill="#ff6b6b"/><circle cx="102" cy="75" r="7" fill="#ffd166"/><circle cx="126" cy="75" r="7" fill="#4ade80"/>
<text x="175" y="83" fill="#eaf4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Tashev Guard</text>
<text x="1450" y="82" fill="#79e3cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" text-anchor="end">● local-only · 127.0.0.1</text>

<text x="95" y="178" fill="#5eead4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2">DEVICE STATUS</text>
<text x="95" y="234" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800">Everything looks calm</text>
<text x="95" y="270" fill="#8fa5c0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">No obvious remote-access sessions or unexpected persistence changes.</text>
<rect x="1265" y="184" width="220" height="54" rx="14" fill="#edf6ff"/>
<text x="1375" y="218" fill="#07111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle">Who is connected?</text>

<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <g transform="translate(95 320)"><rect width="335" height="120" rx="18" fill="#101d30" stroke="#ffffff" stroke-opacity=".08"/><text x="24" y="34" fill="#8197b3" font-size="15">Active connections</text><text x="24" y="89" fill="#ffffff" font-size="42" font-weight="800">244</text></g>
  <g transform="translate(450 320)"><rect width="335" height="120" rx="18" fill="#101d30" stroke="#ffffff" stroke-opacity=".08"/><text x="24" y="34" fill="#8197b3" font-size="15">Listening ports</text><text x="24" y="89" fill="#ffffff" font-size="42" font-weight="800">14</text></g>
  <g transform="translate(805 320)"><rect width="335" height="120" rx="18" fill="#101d30" stroke="#ffffff" stroke-opacity=".08"/><text x="24" y="34" fill="#8197b3" font-size="15">Autostart entries</text><text x="24" y="89" fill="#ffffff" font-size="42" font-weight="800">29</text></g>
  <g transform="translate(1160 320)"><rect width="325" height="120" rx="18" fill="#10291f" stroke="#2dd4bf" stroke-opacity=".22"/><text x="24" y="34" fill="#8197b3" font-size="15">Needs attention</text><text x="24" y="89" fill="#7df7db" font-size="42" font-weight="800">0</text></g>
</g>

<g transform="translate(95 470)">
  <rect width="690" height="320" rx="20" fill="#0e1a2c" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="26" y="42" fill="#5eead4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2">NOW</text>
  <text x="26" y="78" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800">What needs attention</text>
  <rect x="560" y="28" width="100" height="32" rx="16" fill="#123a30"/><text x="610" y="49" fill="#7df7db" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle">NORMAL</text>
  <rect x="26" y="112" width="638" height="62" rx="14" fill="#ffffff" fill-opacity=".035"/>
  <circle cx="50" cy="143" r="6" fill="#2dd4bf"/>
  <text x="72" y="140" fill="#eaf4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">No high-priority findings</text>
  <text x="72" y="161" fill="#8197b3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Current rules found no active remote sessions or new public listeners.</text>
  <text x="26" y="224" fill="#5eead4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2">BASELINE</text>
  <text x="26" y="257" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Learn what “normal” looks like</text>
  <text x="26" y="288" fill="#8197b3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">New listeners and persistence entries are highlighted after the baseline.</text>
</g>

<g transform="translate(810 470)">
  <rect width="675" height="320" rx="20" fill="#0e1a2c" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="26" y="42" fill="#5eead4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2">NETWORK</text>
  <text x="26" y="78" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800">Recent connections</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
    <text x="26" y="118" fill="#6f86a2">PROCESS</text><text x="245" y="118" fill="#6f86a2">LOCAL</text><text x="430" y="118" fill="#6f86a2">REMOTE</text>
    <line x1="26" y1="132" x2="647" y2="132" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="26" y="166" fill="#dbe8f8">Chrome</text><text x="245" y="166" fill="#91a6c1">127.0.0.1:52314</text><text x="430" y="166" fill="#9bdcff">142.250.x.x:443</text>
    <text x="26" y="210" fill="#dbe8f8">Telegram</text><text x="245" y="210" fill="#91a6c1">127.0.0.1:52320</text><text x="430" y="210" fill="#9bdcff">149.154.x.x:443</text>
    <text x="26" y="254" fill="#dbe8f8">node</text><text x="245" y="254" fill="#91a6c1">127.0.0.1:4782</text><text x="430" y="254" fill="#79e3cf">localhost</text>
  </g>
</g>

<text x="800" y="835" fill="#607792" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" text-anchor="middle">Local data · Explainable indicators · No automatic destructive actions</text>
</svg>
