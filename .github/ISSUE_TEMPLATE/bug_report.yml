name: Bug report
description: Report a reproducible Tashev Guard problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the private security reporting flow described in SECURITY.md.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Android
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tashev Guard version / commit
      placeholder: v0.2.0-preview.1 or commit SHA
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove IPs, usernames, tokens, paths or other sensitive data when they are not necessary.
